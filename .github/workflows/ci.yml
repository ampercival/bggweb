name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-not-secret"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev-lock.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are up to date
        run: python manage.py makemigrations games --check --dry-run

      - name: Collect static files (validates the static pipeline)
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test games --verbosity=2

      - name: Production settings smoke check
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: 'ci-only-production-check-long-placeholder-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
          DJANGO_ALLOWED_HOSTS: 'ci.example.invalid'
        run: python manage.py check --deploy --fail-level WARNING

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bggweb
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bggweb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bggweb"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_DEBUG: 'True'
      DATABASE_URL: 'postgres://bggweb:ci-only-password@localhost:5432/bggweb'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev-lock.txt
      - run: python manage.py test games --verbosity=2

  browser:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'True'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test browser_tests --verbosity=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: artifacts/browser/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-audit.txt
      - run: pip-audit -r requirements-lock.txt --progress-spinner off
